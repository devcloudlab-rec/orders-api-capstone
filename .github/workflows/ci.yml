name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install scanners
        run: |
          pip install --quiet semgrep==1.184.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Semgrep
        run: semgrep scan --config .semgrep --error --metrics=off --quiet
      - name: gitleaks
        run: gitleaks git --redact --no-banner --config .gitleaks.toml

  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Checkov and Conftest
        run: |
          pip install --quiet checkov==3.4.3
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz" | tar xz conftest
          sudo mv conftest /usr/local/bin/
      - name: Policy tests
        run: conftest verify
      - name: Checkov
        run: checkov --config-file .checkov.yaml --quiet --compact
      - name: Conftest
        run: conftest test infra --parser hcl2 --combine

  deps:
    name: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv and OSV-Scanner
        run: |
          pip install --quiet uv==0.13.7
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64" -o osv-scanner
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/
      - name: Dependency gate
        run: python tools/deps-gate.py
      - name: Lock file is current
        run: uv lock --check
      - name: OSV-Scanner
        run: osv-scanner scan source -r .
