User nobody
Group nobody
Port 8888
Listen 0.0.0.0
# Do NOT set BindSame: agent traffic arrives on the internal net; outbound
# must use the egress-bridge interface that has internet.
Timeout 600
MaxClients 50
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
ConnectPort 443
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
LogLevel Critical
DisableViaHeader Yes
