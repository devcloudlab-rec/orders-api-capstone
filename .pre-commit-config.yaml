repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact --verbose --no-banner --config .gitleaks.toml
        language: unsupported
        pass_filenames: false
      - id: semgrep
        name: semgrep
        entry: semgrep scan --config .semgrep --error --metrics=off --quiet
        language: unsupported
        types: [python]
        pass_filenames: false
      - id: checkov
        name: checkov
        entry: checkov --config-file .checkov.yaml --quiet --compact
        language: unsupported
        files: ^infra/
        pass_filenames: false
      - id: conftest
        name: conftest
        entry: conftest test infra --parser hcl2 --combine
        language: unsupported
        files: ^(infra|policy)/
        pass_filenames: false
      - id: uv-lock
        name: uv lock is current
        entry: uv lock --check
        language: unsupported
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: deps-gate
        name: dependency gate
        entry: python3 tools/deps-gate.py
        language: unsupported
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
